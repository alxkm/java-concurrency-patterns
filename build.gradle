plugins {
    id 'java'
    id 'jacoco'
    id 'checkstyle'
    id 'pmd'
}

group = 'org.alxkm'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// JMH -- the OpenJDK microbenchmark harness.
//
// Same arrangement as jcstress below: its own source set, compiled by `build` so CI catches breakage,
// but never run as part of it. A benchmark needs warmup and several forks to say anything trustworthy,
// which takes minutes. Run it with:
//
//     ./gradlew jmh
//     ./gradlew jmh -PjmhArgs="Counter -f 1 -wi 3 -i 3"     # one benchmark, quicker
//
// The point of having it is that this repository makes performance claims. Anything it asserts about
// speed should come from a measurement someone can reproduce, not from a number quoted from elsewhere.
sourceSets {
    jmh {
        java.srcDir 'src/jmh/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

tasks.register('jmh', JavaExec) {
    group = 'verification'
    description = 'Runs the JMH benchmarks (minutes, not seconds).'
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'

    def extra = (project.findProperty('jmhArgs') ?: '').toString()
    def resultFile = layout.buildDirectory.file('reports/jmh/results.txt').get().asFile
    doFirst {
        resultFile.parentFile.mkdirs()
    }
    args(extra.isEmpty() ? ['-rf', 'text', '-rff', resultFile.toString()]
                         : extra.split('\s+').toList())
}

// jcstress -- the OpenJDK harness for Java Memory Model races.
//
// Kept in its own source set, off the main build, on purpose. A jcstress run forks a JVM per test and
// hammers each one for seconds at a time, so a full run takes minutes; wiring it into `check` would make
// every build slow for a result that only changes when the memory-model examples change. Run it with:
//
//     ./gradlew jcstress
//
// The tests here exist because these races cannot be demonstrated by an ordinary unit test: lining two
// threads up needs synchronisation, and that synchronisation is itself a barrier that hides the effect.
sourceSets {
    jcstress {
        java.srcDir 'src/jcstress/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    jcstressImplementation 'org.openjdk.jcstress:jcstress-core:0.16'
    jcstressAnnotationProcessor 'org.openjdk.jcstress:jcstress-core:0.16'
}

tasks.register('jcstress', JavaExec) {
    group = 'verification'
    description = 'Runs the Java Memory Model stress tests (minutes, not seconds).'
    classpath = sourceSets.jcstress.runtimeClasspath
    mainClass = 'org.openjdk.jcstress.Main'

    // Default mode, not sanity: sanity collects a few dozen samples per test, and the reordering
    // these tests exist to demonstrate shows up in roughly 4% of samples -- far too rare to appear.
    // A full run is a few minutes. Pass -PjcstressArgs=... to override, e.g.
    //     ./gradlew jcstress -PjcstressArgs="-t PlainFields -m quick"
    def extra = (project.findProperty('jcstressArgs') ?: '').toString()
    args(extra.isEmpty() ? ['-v', '-r', "${layout.buildDirectory.get()}/reports/jcstress"]
                         : extra.split('\s+').toList())
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all'
}

test {
    useJUnitPlatform()

    // A bug in a concurrency example is far more likely to hang than to fail an assertion. Without a
    // default timeout a deadlock regression would stall CI until the job is killed, with no clue as to
    // which test caused it; with one, the offending test fails by name.
    systemProperty 'junit.jupiter.execution.timeout.default', '60s'
    finalizedBy jacocoTestReport
    
    // Report failures as they happen, with enough detail to diagnose them from a CI log.
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
        showCauses = true
        showExceptions = true
        showStackTraces = true
        showStandardStreams = false

        info {
            events 'started', 'passed', 'failed', 'skipped'
            exceptionFormat = 'full'
        }

        debug {
            events 'started', 'passed', 'skipped', 'failed', 'standardOut', 'standardError'
            exceptionFormat = 'full'
        }
    }

    // A one-line tally once the run finishes. The afterSuite/beforeTest/afterTest closures this
    // replaces are deprecated and go away in Gradle 10; addTestListener is their replacement.
    addTestListener(new TestListener() {
        @Override void beforeSuite(TestDescriptor suite) {}
        @Override void beforeTest(TestDescriptor test) {}
        @Override void afterTest(TestDescriptor test, TestResult result) {}

        @Override
        void afterSuite(TestDescriptor suite, TestResult result) {
            if (suite.parent != null) {
                return // only the root suite carries the totals
            }
            def summary = "Results: ${result.resultType} (${result.testCount} tests, " +
                    "${result.successfulTestCount} successes, ${result.failedTestCount} failures, " +
                    "${result.skippedTestCount} skipped)"
            def rule = '-' * (summary.length() + 6)
            println()
            println(rule)
            println("|  ${summary}  |")
            println(rule)
            if (result.failedTestCount > 0) {
                println()
                println('Failed tests are listed above. Reports: build/reports/tests/test/index.html')
            }
        }
    })
}

// Custom task to print failed test details
task printFailedTests {
    doLast {
        def testResultsDir = layout.buildDirectory.dir('test-results/test').get().asFile
        if (testResultsDir.exists()) {
            testResultsDir.listFiles().findAll { it.name.endsWith('.xml') }.each { file ->
                def xml = new groovy.xml.XmlSlurper().parse(file)
                xml.testcase.each { testcase ->
                    if (testcase.failure.size() > 0) {
                        println("\n💥 FAILED TEST: ${testcase.@classname}.${testcase.@name}")
                        println("   Time: ${testcase.@time}s")
                        testcase.failure.each { failure ->
                            println("   Type: ${failure.@type}")
                            println("   Message: ${failure.@message}")
                            if (failure.text()) {
                                println("   Details:")
                                failure.text().split('\n').take(10).each { line ->
                                    println("     ${line}")
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}

// JaCoCo Configuration - NON-BREAKING
jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// Checkstyle Configuration - NON-BREAKING
checkstyle {
    toolVersion = '10.12.7'
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    ignoreFailures = true  // 🛡️ WON'T BREAK BUILD
}

// Fix Guava dependency conflict
configurations.checkstyle {
    resolutionStrategy.capabilitiesResolution.withCapability("com.google.collections:google-collections") {
        select("com.google.guava:guava:23.0")
    }
}

// PMD Configuration - NON-BREAKING  
pmd {
    consoleOutput = true
    toolVersion = '7.0.0'
    ignoreFailures = true  // 🛡️ WON'T BREAK BUILD
    ruleSets = [
        'category/java/errorprone.xml',
        'category/java/bestpractices.xml',
        'category/java/multithreading.xml'
    ]
}
